name: Update player counts

on:
  schedule:
    - cron: "17 * * * *"   # hourly, off the top of the hour when GitHub's queue is busiest
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Load history from the data branch
        run: |
          if git fetch --depth=1 origin data; then
            git show FETCH_HEAD:history.json > history.json
          else
            echo "no data branch yet, starting fresh"
          fi

      - name: Check Steam and build the site
        run: python3 collect.py --history history.json --site site

      - name: Save history to the data branch
        run: |
          # one commit, force-pushed, so hourly updates don't pile up in git history
          tmp=$(mktemp -d)
          cp history.json "$tmp/"
          cd "$tmp"
          git init -q -b data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add history.json
          git commit -qm "History as of $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" data

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: collect
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
